
<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101e2a">
  <meta name="description" content="ScrubUp Aussie provides residential, deep, bond, restaurant and property cleaning services across Australia. Request your cleaning quote today.">
  <meta property="og:title" content="ScrubUp Aussie | A Higher Standard of Clean">
  <meta property="og:description" content="Thoughtful cleaning. Exceptional presentation. Request your quote online.">
  <title>ScrubUp Aussie | A Higher Standard of Clean</title>

  <!-- Add favicon.png to your GitHub repository root -->
  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #101e2a;
      --navy-light: #182c39;
      --teal: #168f89;
      --teal-dark: #08756f;
      --mint: #e7f5f1;
      --gold: #c6a66a;
      --cream: #faf9f6;
      --white: #ffffff;
      --text: #243640;
      --muted: #6b7b82;
      --border: #e5eae8;
      --shadow: 0 18px 55px rgba(16, 30, 42, .09);
      --radius: 22px;
      --max-width: 1180px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      margin: 0;
      background: var(--white);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    body, button, a { -webkit-tap-highlight-color: transparent; }

    a { color: inherit; text-decoration: none; }

    img { max-width: 100%; display: block; }

    button, input, select, textarea { font: inherit; }

    .container {
      width: min(var(--max-width), calc(100% - 44px));
      margin-inline: auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--teal-dark);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 24px;
      height: 2px;
      background: var(--gold);
    }

    h1, h2, h3, p { margin-top: 0; }

    h1, h2, h3 {
      font-family: "Manrope", sans-serif;
      letter-spacing: -.045em;
      line-height: 1.15;
    }

    h1 { font-size: clamp(2.8rem, 6vw, 5.35rem); }
    h2 { font-size: clamp(2rem, 4vw, 3.35rem); }
    h3 { font-size: 1.25rem; }

    .section { padding: 100px 0; }

    .section-heading {
      max-width: 690px;
      margin-bottom: 44px;
    }

    .section-heading h2 { margin: 15px 0; }

    .section-heading p {
      max-width: 590px;
      color: var(--muted);
      margin-bottom: 0;
    }

    .center { text-align: center; margin-inline: auto; }

    .center .eyebrow { justify-content: center; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 14px 23px;
      border: 1px solid transparent;
      border-radius: 7px;
      font-weight: 700;
      font-size: .93rem;
      transition: transform .25s ease, background .25s ease, box-shadow .25s ease;
      cursor: pointer;
    }

    .btn:hover { transform: translateY(-3px); }

    .btn-primary {
      background: var(--teal);
      color: white;
      box-shadow: 0 9px 24px rgba(22,143,137,.19);
    }

    .btn-primary:hover { background: var(--teal-dark); }

    .btn-light {
      background: white;
      color: var(--navy);
    }

    .btn-outline {
      border-color: rgba(255,255,255,.35);
      color: white;
      background: transparent;
    }

    .btn-outline-dark {
      border-color: var(--border);
      color: var(--navy);
      background: white;
    }

    /* Navigation */

    .topbar {
      background: var(--navy);
      color: rgba(255,255,255,.82);
      font-size: .78rem;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      min-height: 37px;
    }

    .topbar strong { color: white; font-weight: 600; }

    .topbar-note {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .topbar-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64c7ac;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid rgba(16,30,42,.07);
      backdrop-filter: blur(16px);
    }

    .nav-inner {
      min-height: 84px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-width: 0;
    }

    .brand img {
      width: 190px;
      max-height: 64px;
      object-fit: contain;
      object-position: left center;
    }

    .brand-fallback {
      display: none;
      color: var(--navy);
      font-family: "Manrope", sans-serif;
      font-size: 1.22rem;
      font-weight: 800;
      letter-spacing: -.05em;
      line-height: 1.1;
    }

    .brand-fallback span {
      display: block;
      color: var(--teal);
      font-size: .7rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-top: 5px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: .88rem;
      font-weight: 600;
    }

    .nav-links > a:not(.btn) {
      color: #53636b;
      transition: color .2s ease;
    }

    .nav-links > a:not(.btn):hover { color: var(--teal); }

    .menu-toggle {
      display: none;
      border: 1px solid var(--border);
      background: white;
      color: var(--navy);
      border-radius: 8px;
      width: 45px;
      height: 43px;
      font-size: 1.35rem;
      cursor: pointer;
    }

    /* Hero */

    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 88% 22%, rgba(22,143,137,.19), transparent 35%),
        radial-gradient(ellipse at 12% 100%, rgba(198,166,106,.10), transparent 38%),
        var(--navy);
      color: white;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 480px;
      height: 480px;
      right: -230px;
      bottom: -270px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 50%;
      box-shadow: 0 0 0 55px rgba(255,255,255,.018),
                  0 0 0 110px rgba(255,255,255,.018);
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 60px;
      align-items: center;
      min-height: 620px;
      padding-top: 78px;
      padding-bottom: 82px;
      position: relative;
      z-index: 1;
    }

    .hero .eyebrow { color: #b4ddd4; }

    .hero h1 {
      max-width: 720px;
      margin: 24px 0;
      font-weight: 700;
    }

    .hero h1 em {
      color: #83d1c3;
      font-style: normal;
    }

    .hero-copy {
      max-width: 555px;
      color: rgba(255,255,255,.72);
      font-size: 1.05rem;
      line-height: 1.85;
      margin-bottom: 29px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
    }

    .hero-footnote {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 28px;
      color: rgba(255,255,255,.65);
      font-size: .83rem;
    }

    .hero-footnote svg { flex-shrink: 0; color: #83d1c3; }

    .hero-visual {
      position: relative;
      min-height: 425px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-photo {
      position: absolute;
      inset: 8px 0 8px 8px;
      overflow: hidden;
      border-radius: 180px 180px 22px 22px;
      background:
        linear-gradient(180deg, rgba(16,30,42,.02), rgba(16,30,42,.5)),
        url("https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1200&q=85") center/cover;
      box-shadow: 0 28px 75px rgba(0,0,0,.26);
    }

    .hero-photo::after {
      content: "";
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: inherit;
    }

    .hero-float {
      position: absolute;
      z-index: 2;
      bottom: 28px;
      left: -28px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 17px 20px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 12px;
      background: rgba(255,255,255,.97);
      color: var(--navy);
      box-shadow: var(--shadow);
      animation: float 5s ease-in-out infinite;
    }

    .float-icon {
      display: grid;
      place-items: center;
      width: 43px;
      height: 43px;
      border-radius: 10px;
      background: var(--mint);
      color: var(--teal-dark);
      font-size: 1.3rem;
    }

    .hero-float strong { display: block; font-size: .9rem; }
    .hero-float small { color: var(--muted); font-size: .76rem; }

    .hero-stamp {
      position: absolute;
      top: 28px;
      right: -18px;
      display: grid;
      place-items: center;
      width: 105px;
      height: 105px;
      padding: 15px;
      border: 1px solid rgba(198,166,106,.6);
      border-radius: 50%;
      background: var(--navy-light);
      color: #e1c68f;
      text-align: center;
      font-size: .68rem;
      line-height: 1.5;
      letter-spacing: .1em;
      text-transform: uppercase;
      transform: rotate(8deg);
    }

    /* Assurance strip */

    .assurance {
      border-bottom: 1px solid var(--border);
      background: white;
    }

    .assurance-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 25px 0;
    }

    .assurance-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 6px 18px;
      border-right: 1px solid var(--border);
      color: var(--navy);
      font-size: .9rem;
      font-weight: 700;
    }

    .assurance-item:last-child { border-right: 0; }

    .assurance-icon {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--mint);
      color: var(--teal-dark);
      font-size: 1rem;
    }

    /* Services */

    .services-section { background: var(--cream); }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .service-card {
      overflow: hidden;
      position: relative;
      padding: 29px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white;
      transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
    }

    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
      border-color: #c5e2dc;
    }

    .service-icon {
      display: grid;
      place-items: center;
      width: 53px;
      height: 53px;
      margin-bottom: 23px;
      border-radius: 15px;
      background: var(--mint);
      color: var(--teal-dark);
      font-size: 1.45rem;
    }

    .service-card h3 { margin-bottom: 12px; }

    .service-card p {
      margin-bottom: 18px;
      color: var(--muted);
      font-size: .92rem;
    }

    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--teal-dark);
      font-size: .9rem;
      font-weight: 800;
    }

    .text-link span { transition: transform .2s ease; }
    .text-link:hover span { transform: translateX(4px); }

    /* About */

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 75px;
    }

    .about-visual {
      position: relative;
      min-height: 450px;
    }

    .about-photo {
      position: absolute;
      inset: 0 35px 35px 0;
      border-radius: 14px 120px 14px 14px;
      background:
        linear-gradient(180deg, transparent 55%, rgba(16,30,42,.2)),
        url("https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1100&q=85") center/cover;
    }

    .about-accent {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 54%;
      padding: 26px;
      border: 6px solid white;
      border-radius: 12px;
      background: var(--navy);
      color: white;
    }

    .about-accent strong {
      display: block;
      color: #a8ded2;
      font-family: "Manrope", sans-serif;
      font-size: 1.4rem;
      line-height: 1.3;
    }

    .about-accent span {
      display: block;
      margin-top: 8px;
      color: rgba(255,255,255,.7);
      font-size: .8rem;
    }

    .about-copy h2 { margin: 17px 0 22px; }

    .about-copy > p {
      color: var(--muted);
      margin-bottom: 25px;
    }

    .benefit-list {
      display: grid;
      gap: 16px;
      margin: 25px 0 32px;
    }

    .benefit {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .check {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      margin-top: 1px;
      border-radius: 50%;
      background: var(--mint);
      color: var(--teal-dark);
      font-size: .8rem;
      font-weight: 800;
    }

    .benefit strong { display: block; font-size: .94rem; }
    .benefit small { color: var(--muted); font-size: .86rem; }

    /* Bond cleaning */

    .bond-section {
      position: relative;
      overflow: hidden;
      background: var(--navy);
      color: white;
    }

    .bond-section::before {
      content: "";
      position: absolute;
      top: -250px;
      left: -220px;
      width: 570px;
      height: 570px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%;
      box-shadow: 0 0 0 70px rgba(255,255,255,.018),
                  0 0 0 140px rgba(255,255,255,.018);
    }

    .bond-grid {
      position: relative;
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      align-items: center;
      gap: 65px;
    }

    .bond-copy .eyebrow { color: #b4ddd4; }
    .bond-copy h2 { margin: 17px 0 20px; }
    .bond-copy p { color: rgba(255,255,255,.7); }

    .bond-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 13px 20px;
      margin: 26px 0 32px;
    }

    .bond-list div {
      display: flex;
      align-items: center;
      gap: 9px;
      color: rgba(255,255,255,.85);
      font-size: .87rem;
    }

    .bond-list span { color: #87d3c4; }

    .pricing-panel {
      padding: 35px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 20px;
      background: rgba(255,255,255,.055);
      backdrop-filter: blur(10px);
    }

    .pricing-panel > p {
      color: rgba(255,255,255,.68);
      font-size: .9rem;
      margin-bottom: 25px;
    }

    .price-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 22px 0;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .price-option:last-of-type { border-bottom: 0; }

    .price-label strong {
      display: block;
      font-size: 1rem;
    }

    .price-label small {
      display: block;
      color: rgba(255,255,255,.62);
      font-size: .8rem;
      margin-top: 5px;
    }

    .price-value {
      color: #a7dfd4;
      font-family: "Manrope", sans-serif;
      font-size: clamp(1.55rem, 3vw, 2.2rem);
      font-weight: 800;
      white-space: nowrap;
      letter-spacing: -.06em;
    }

    .price-value small {
      display: block;
      color: rgba(255,255,255,.65);
      font-family: "DM Sans", sans-serif;
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: 0;
      text-align: right;
    }

    .pricing-panel .btn { width: 100%; margin-top: 20px; }

    .pricing-note {
      margin: 15px 0 0 !important;
      font-size: .76rem !important;
      text-align: center;
    }

    /* Process */

    .process-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 35px;
    }

    .process-step { position: relative; padding-top: 14px; }

    .step-number {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      margin-bottom: 22px;
      border: 1px solid #c9e5df;
      border-radius: 50%;
      background: var(--mint);
      color: var(--teal-dark);
      font-family: "Manrope", sans-serif;
      font-size: 1rem;
      font-weight: 800;
    }

    .process-step h3 { margin-bottom: 10px; }
    .process-step p { color: var(--muted); font-size: .93rem; }

    /* Service area */

    .coverage {
      padding: 75px 0;
      background: var(--mint);
    }

    .coverage-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 35px;
    }

    .coverage h2 { margin: 14px 0 12px; }

    .coverage p {
      max-width: 670px;
      margin-bottom: 0;
      color: #536b6a;
    }

    .coverage-badge {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-shrink: 0;
      padding: 20px 24px;
      border: 1px solid rgba(8,117,111,.16);
      border-radius: 13px;
      background: rgba(255,255,255,.72);
    }

    .coverage-badge .globe {
      font-size: 1.8rem;
      color: var(--teal-dark);
    }

    .coverage-badge strong { display: block; color: var(--navy); }
    .coverage-badge small { color: var(--muted); font-size: .78rem; }

    /* CTA */

    .cta-section { padding: 90px 0; }

    .cta-card {
      position: relative;
      overflow: hidden;
      padding: 65px 35px;
      border-radius: 24px;
      background:
        radial-gradient(ellipse at 100% 0%, rgba(22,143,137,.26), transparent 42%),
        var(--navy);
      color: white;
      text-align: center;
    }

    .cta-card::after {
      content: "";
      position: absolute;
      top: -180px;
      right: -140px;
      width: 350px;
      height: 350px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 50%;
      box-shadow: 0 0 0 45px rgba(255,255,255,.02),
                  0 0 0 90px rgba(255,255,255,.02);
    }

    .cta-card > * { position: relative; z-index: 1; }
    .cta-card .eyebrow { color: #b4ddd4; justify-content: center; }

    .cta-card h2 {
      max-width: 680px;
      margin: 18px auto;
    }

    .cta-card p {
      max-width: 560px;
      margin: 0 auto 28px;
      color: rgba(255,255,255,.72);
    }

    .cta-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Footer */

    footer {
      padding: 55px 0 25px;
      background: #0b1720;
      color: white;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.4fr .8fr .8fr;
      gap: 55px;
      padding-bottom: 45px;
    }

    .footer-brand img {
      width: 190px;
      max-height: 65px;
      object-fit: contain;
      object-position: left center;
      margin-bottom: 20px;
      /* A transparent light logo works best on this background. */
    }

    .footer-brand p {
      max-width: 340px;
      color: rgba(255,255,255,.62);
      font-size: .88rem;
    }

    .footer-title {
      margin: 0 0 18px;
      font-family: "Manrope", sans-serif;
      font-size: .95rem;
      font-weight: 800;
    }

    .footer-links {
      display: grid;
      gap: 10px;
    }

    .footer-links a, .footer-links span {
      color: rgba(255,255,255,.66);
      font-size: .87rem;
      transition: color .2s ease;
    }

    .footer-links a:hover { color: #9bdbcf; }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-top: 23px;
      border-top: 1px solid rgba(255,255,255,.11);
      color: rgba(255,255,255,.48);
      font-size: .78rem;
    }

    .footer-bottom a { color: rgba(255,255,255,.7); }

    /* Floating WhatsApp */

    .whatsapp-float {
      position: fixed;
      z-index: 90;
      right: 22px;
      bottom: 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 18px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 50px;
      background: #148a63;
      color: white;
      font-size: .86rem;
      font-weight: 800;
      box-shadow: 0 12px 35px rgba(0,0,0,.19);
      transition: transform .2s ease, background .2s ease;
    }

    .whatsapp-float:hover {
      transform: translateY(-4px);
      background: #0d7452;
    }

    .whatsapp-float svg { width: 22px; height: 22px; }

    /* Animation */

    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity .7s ease, transform .7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
